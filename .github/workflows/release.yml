name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: bun install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
        shell: bash
      - name: Build release package
        run: bun run tools/package-release.ts --output dist/stage/xi --release-directory dist/release
      - name: Smoke test package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary=dist/stage/xi/xi
          "$binary" --health
          "$binary" --version
      - name: Smoke test package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw docs/installation/install.ps1)) | Out-Null
          & dist/stage/xi/xi.exe --health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/stage/xi/xi.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          $release = Join-Path $env:RUNNER_TEMP "xi-release/download/$tag"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item dist/release/* $release
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:RUNNER_TEMP) -PassThru -NoNewWindow
          try {
            $env:XI_RELEASE_URL = 'http://127.0.0.1:8765/xi-release'
            $env:XI_VERSION = $tag
            $env:XI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'xi-installed'
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { Invoke-WebRequest "$env:XI_RELEASE_URL/download/$tag/SHA256SUMS" -TimeoutSec 1 | Out-Null; break }
              catch { Start-Sleep -Milliseconds 100 }
            }
            & docs/installation/install.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $env:XI_INSTALL_DIR 'xi.exe') --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path (Join-Path $env:XI_INSTALL_DIR 'xi-support/CATPPUCCIN-LICENSE'))) { throw 'installed theme license is missing' }
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - name: Smoke test compiled terminal on Unix
        if: runner.os != 'Windows'
        run: python3 tests/distribution/t064-compiled-pty.py
      - name: Run full package smoke on Linux ARM64
        if: matrix.target == 'linux-arm64'
        run: bun run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/xi-*
          if-no-files-found: error
          retention-days: 7

  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Add platform installers and checksums
        run: |
          set -euo pipefail
          cp docs/installation/install.sh docs/installation/install.ps1 dist/release/
          (cd dist/release && sha256sum xi-* install.sh install.ps1 > SHA256SUMS)
      - name: Prepare GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cat > dist/release/NOTES.md <<NOTES
          Xi ${GITHUB_REF_NAME} adds native Markdown previews with Space p and keeps Ctrl+O/Ctrl+I jump history across editor restarts.

          **macOS / Linux**

          ```sh
          curl -fsSL https://github.com/OlegHQ/xi/releases/latest/download/install.sh | sh
          ```

          **Windows PowerShell**

          ```powershell
          irm https://github.com/OlegHQ/xi/releases/latest/download/install.ps1 | iex
          ```
          NOTES
          gh release create "$tag" dist/release/xi-* dist/release/SHA256SUMS dist/release/install.sh dist/release/install.ps1 \
            --draft --verify-tag --title "Xi $tag" \
            --notes-file dist/release/NOTES.md
