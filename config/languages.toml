schema-version = 1

[language-server.typescript]
command = "typescript-language-server"
args = ["--stdio"]
root-markers = ["tsconfig.json", "package.json", ".git"]

[language-server.rust]
command = "rust-analyzer"
args = []
root-markers = ["Cargo.toml", ".git"]

[language-server.ocaml]
command = "ocamllsp"
args = []
root-markers = ["dune-project", "dune-workspace", ".git"]

[language-server.ruby-lsp]
command = "ruby-lsp"
args = []
root-markers = ["Gemfile", "gems.rb", ".ruby-version", ".git"]

[[language]]
name = "typescript"
file-types = ["ts", "tsx"]
language-servers = ["typescript"]
indent = { tab-width = 2, unit = "\t" }
formatter = { command = "biome", args = ["format", "--stdin-file-path", "{file}"] }
auto-format = true

[[language]]
name = "rust"
file-types = ["rs"]
language-servers = ["rust"]
indent = { tab-width = 4, unit = "    " }
auto-format = false

[[language]]
name = "ocaml"
file-types = ["ml"]
language-servers = ["ocaml"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "ocamlformat", args = ["--name", "{file}", "-"] }
auto-format = true

[[language]]
name = "ocaml_interface"
file-types = ["mli"]
language-servers = ["ocaml"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "ocamlformat", args = ["--name", "{file}", "-"] }
auto-format = true

[[language]]
name = "ruby"
file-types = ["rb", "rake", "gemspec", "Gemfile", "Rakefile", "Guardfile", "Podfile", "Vagrantfile", ".irbrc"]
language-servers = ["ruby-lsp"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "rubocop", args = ["--fix-layout", "--stderr", "--fail-level", "fatal", "--stdin", "{file}"] }
auto-format = true
