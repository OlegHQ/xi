[xi]
schema-version = 1
profile = "xi"

[xi.sidebar]
visible = true
width = 28
panel = "files"

[xi.mouse]
modifier = "none"

[xi.selection]
limit = 10000
history-limit = 100

[xi.hints]
delay-ms = 250

[xi.search]
debounce-ms = 40
max-visible-results = 10000

[editor]
theme = "xi-light"
line-number = "absolute"
cursorline = false
continue-comments = true
cursorcolumn = false
rainbow-brackets = false
rulers = []
text-width = 80
scrolloff = 5
auto-completion = true
completion-timeout = 250
completion-trigger-len = 2
preview-completion-insert = true
auto-info = true
completion-replace = false
color-modes = false
true-color = false
bufferline = "never"
default-line-ending = "native"
popup-border = "none"
jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
wrap = false
auto-format = true
default-yank-register = '"'
insert-final-newline = true
trim-final-newlines = false
trim-trailing-whitespace = false

[editor.word-completion]
enable = true
trigger-length = 7

[editor.workspace-trust]
level = "servers"
prompt = true
trusted = []

[editor.auto-save]
focus-lost = false
after-delay.enable = false
after-delay.timeout = 3000

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
separator = "│"
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.gutters.line-numbers]
min-width = 3

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "block"

[editor.soft-wrap]
max-wrap = 20
max-indent-retain = 40
wrap-indicator = "↪ "

[editor.file-picker]
hidden = true
follow-symlinks = true
deduplicate-links = true

[editor.lsp]
enable = true
display-inlay-hints = false
display-color-swatches = true
auto-document-highlight = false
goto-reference-include-declaration = true
snippets = true
display-messages = true
display-progress-messages = false
auto-signature-help = true
display-signature-help-docs = true

[editor.mouse]
enabled = true
scroll-lines = 3

[search]
hidden = true
follow-symlinks = false

[keys.normal.space]
q = "macro.record"
c = "config.open"
s = "sidebar.toggle"
f = "files.pick"
b = "buffers.pick"
";" = "command.pick"
"/" = "search.workspace"
o = "files.edit-directory"
O = "files.edit-buffer-directory"
t = "theme.pick"
k = "lsp.hover"
a = "lsp.code-action"
d = "panel.problems.focus"
e = "panel.problems.focus"
m = "editor.mouse.toggle"
r = "search.replace"

[keys.normal.space.v]
p = "panel.problems.focus"
f = "panel.files.focus"
s = "panel.search.focus"
g = "panel.git.focus"
o = "panel.outline.focus"
d = "git.diff"

[xi.keys.files-panel.space]
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.open"
q = "panel.close"

[xi.keys.search-panel.space]
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.open"
q = "panel.close"

[xi.keys.git-panel.space]
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.open"
q = "panel.close"

[xi.keys.diff-panel.space]
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.open"
q = "panel.close"

[xi.aliases]
files = "files.pick"
buffers = "buffers.pick"
commands = "command.pick"
buffer-next = "buffer.next"
buffer-previous = "buffer.previous"
theme = "theme.pick"
config-open = "config.open"
config-reload = "config.reload"
write-quit = "write.quit"
quit-all = "quit.all"
write-all = "write.all"
