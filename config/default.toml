[xi]
schema-version = 1
profile = "xi"

[xi.sidebar]
visible = true
width = 28
panel = "files"

[xi.mouse]
modifier = "none"

[xi.selection]
limit = 10000
history-limit = 100

[xi.hints]
delay-ms = 250

[xi.search]
debounce-ms = 5
max-visible-results = 10000

[editor]
editor-config = true
theme = "xi-light"
mouse = true
middle-click-paste = true
mouse-yank-register = "*"
kitty-keyboard-protocol = "auto"
shell = ["sh", "-c"]
line-number = "absolute"
cursorline = false
continue-comments = true
cursorcolumn = false
rainbow-brackets = false
rulers = []
text-width = 80
workspace-lsp-roots = []
scrolloff = 5
idle-timeout = 250
scroll-lines = 3
auto-completion = true
auto-pairs = true
path-completion = true
completion-timeout = 250
completion-trigger-len = 2
preview-completion-insert = true
auto-info = true
completion-replace = false

color-modes = false
true-color = false
undercurl = false
bufferline = "never"
default-line-ending = "native"
atomic-save = true
indent-heuristic = "hybrid"
popup-border = "none"
jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
wrap = false
auto-format = true
default-yank-register = '"'
insert-final-newline = true
trim-final-newlines = false
trim-trailing-whitespace = false
end-of-line-diagnostics = "hint"

[editor.word-completion]
enable = true
trigger-length = 7

[editor.workspace-trust]
level = "servers"
prompt = true
trusted = []

[editor.auto-save]
focus-lost = false
after-delay.enable = false
after-delay.timeout = 3000

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
separator = "│"
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.gutters.line-numbers]
min-width = 3

[editor.indent-guides]
render = false
character = "│"
skip-levels = 0

[editor.whitespace]
render = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
tabpad = " "
newline = "⏎"

[editor.smart-tab]
enable = true
supersede-menu = false

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "block"

[editor.soft-wrap]
wrap-at-text-width = false
max-wrap = 20
max-indent-retain = 40
wrap-indicator = "↪ "

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"
prefix-len = 1
max-wrap = 20
min-diagnostic-width = 40
max-diagnostics = 10

[editor.search]
smart-case = true
wrap-around = true

[editor.file-picker]
hidden = true
follow-symlinks = true
deduplicate-links = true
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true

[editor.file-explorer]
hidden = true
follow-symlinks = false
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true
flatten-dirs = true

[editor.buffer-picker]
start-position = "current"

[editor.lsp]
enable = true
goto-reference-include-declaration = true
display-inlay-hints = false
display-color-swatches = true
auto-document-highlight = false
snippets = true
display-messages = true
display-progress-messages = false
auto-signature-help = true
display-signature-help-docs = true

[search]
hidden = true
follow-symlinks = false

[keys.normal]
"<C-Up>" = "view.scroll-up"
"<C-Down>" = "view.scroll-down"
"<C-d>" = "view.half-page-down"
"<C-u>" = "view.half-page-up"

[keys.select]
"<C-Up>" = "view.scroll-up"
"<C-Down>" = "view.scroll-down"
"<C-d>" = "view.half-page-down"
"<C-u>" = "view.half-page-up"

[keys.normal.space]
q = "macro.record"
Y = '@"+yy'
c = "config.open"
s = "sidebar.toggle"
f = "files.pick"
b = "buffers.pick"
";" = "command.pick"
"/" = "search.workspace"
o = "files.edit-directory"
O = "files.edit-buffer-directory"
t = "theme.pick"
k = "lsp.hover"
a = "lsp.code-action"
d = "diagnostics.pick"
e = "panel.problems.focus"
m = "editor.mouse.toggle"
w = "editor.wrap.toggle"
p = "editor.markdown-preview.toggle"
r = "search.replace"

[keys.normal.space.v]
p = "panel.problems.focus"
f = "panel.files.focus"
s = "panel.search.focus"
g = "panel.git.focus"
o = "panel.outline.focus"
d = "git.diff"

[xi.keys.files-panel.space]
h = "panel.include-hidden"
i = "panel.include-ignored"
f = "panel.files.focus"
g = "panel.git.focus"
e = "panel.expand-all"
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.outline.toggle"
q = "panel.close"

[xi.keys.search-panel.space]
h = "panel.include-hidden"
i = "panel.include-ignored"
f = "panel.files.focus"
g = "panel.git.focus"
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.outline.toggle"
q = "panel.close"

[xi.keys.file-picker.space]
h = "panel.include-hidden"
i = "panel.include-ignored"

[xi.keys.git-panel.space]
f = "panel.files.focus"
g = "panel.git.focus"
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.outline.toggle"
q = "panel.close"

[xi.keys.diff-panel.space]
s = "sidebar.toggle"
l = "panel.preview"
o = "panel.open"
q = "panel.close"

[xi.aliases]
files = "files.pick"
buffers = "buffers.pick"
commands = "command.pick"
buffer-next = "buffer.next"
buffer-previous = "buffer.previous"
theme = "theme.pick"
config-open = "config.open"
config-reload = "config.reload"
write-quit = "write.quit"
quit-all = "quit.all"
write-all = "write.all"
